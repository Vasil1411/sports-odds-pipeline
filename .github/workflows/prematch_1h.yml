name: Prematch 1h Auto Sync

on:
  schedule:
    # Проверява на всеки 10 минути дали има мач в прозореца "1 час преди началото"
      - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-1h-before-kickoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv pydantic duckdb pandas openpyxl dbt-duckdb

      - name: Run 1h prematch sync for all matches in DB
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python src/prematch_from_db.py --window-minutes 15

      - name: Commit updated database and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/warehouse.duckdb ] && git add data/warehouse.duckdb || true
          [ -d data/silver ] && git add data/silver/ || true
          [ -f data/prematch_db_triggers.json ] && git add data/prematch_db_triggers.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync odds 1h before kickoff"
            git push
          else
            echo "Няма нови мачове в прозореца -1h или няма промени."
          fi