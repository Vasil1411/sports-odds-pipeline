name: Prematch 1h Auto Sync

on:
  schedule:
    # Проверява на всеки 5 минути дали има мач в прозореца от 1 час до 1 минута преди началото
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      window_minutes:
        description: "Прозорец в минути (от 1h до 1m преди мача — остави 59)"
        required: false
        default: "59"
        type: string

permissions:
  contents: write

jobs:
  sync-1h-before-kickoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv pydantic duckdb pandas openpyxl dbt-duckdb pyspark

      - name: Run 1h prematch sync for all matches in DB
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          WINDOW_MINUTES="${{ inputs.window_minutes }}"
          if [ -z "$WINDOW_MINUTES" ]; then
            WINDOW_MINUTES="59"
          fi
          python src/prematch_from_db.py --window-minutes "$WINDOW_MINUTES"

      - name: Commit updated database and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/warehouse.duckdb ] && git add data/warehouse.duckdb || true
          [ -d data/silver ] && git add data/silver/ || true
          [ -f data/prematch_db_triggers.json ] && git add data/prematch_db_triggers.json || true
          [ -d data/raw ] && git add data/raw/ || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync odds 1h to 1m before kickoff"
            git push
          else
            echo "Няма нови мачове в прозореца или няма промени."
          fi