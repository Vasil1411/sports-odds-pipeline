name: Post-Match Scores (12:15 BG)

on:
  schedule:
    # 12:15 EET (зимно време в България = 10:15 UTC)
    - cron: "15 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warehouse-db-sync
  cancel-in-progress: false

jobs:
  fetch-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb requests

      - name: Fetch scores only for pending DB events
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/fetch_scores.py

      - name: Commit updated database and scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/warehouse.duckdb ] && git add data/warehouse.duckdb || true
          [ -d data/bronze/scores ] && git add data/bronze/scores || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(scores): update match results at $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"
            git push
          else
            echo "Няма нови мачове с резултати или няма промени."
          fi